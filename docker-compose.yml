# Services de développement de Quartea.
#   docker compose up -d                 → Keycloak (http://localhost:8080) et sa base
#   docker compose --profile db up -d    → + PostgreSQL de l'application (port 5433)
#
# Le profil `db` est facultatif : il remplace le conteneur `hackaton-pg` lancé à la main.
# Identifiants ci-dessous : développement local uniquement.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    ports:
      - "8080:8080"
    volumes:
      # Realm importé au premier démarrage (ignoré s'il existe déjà en base).
      - ./keycloak/realm-place-commune.json:/opt/keycloak/data/import/realm-place-commune.json:ro
      # Thème des pages de connexion (styles de l'application + charte de la ville courante).
      - ./keycloak/themes/place-commune:/opt/keycloak/themes/place-commune:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17
    profiles: ["db"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hackaton_eseo_2026
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  keycloak-data:
  postgres-data:
