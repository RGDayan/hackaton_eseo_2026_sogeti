# Thème de connexion Quartea : reprend le style de l'application
# (fond papier, cartes arrondies, Fraunces / Instrument Sans) et la charte de la ville courante.
parent=keycloak.v2
import=common/keycloak

# styles.css vient du thème parent ; place-commune.css le surcharge.
styles=css/styles.css css/place-commune.css
scripts=js/ville.js

# L'application n'a pas de mode sombre : la page de connexion non plus.
darkMode=false
